<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0e0e0e"/>

  <!--
    Circle arc: ~290 degrees, gap at top-right (roughly 1 o'clock area).
    Center 256,256 radius 110.
    Arc from 50° to 340° (clockwise), gap between 340° and 50°.
    Start point: 256+110*cos(50°) , 256+110*sin(50°)  = 326.7, 340.3
    End point:   256+110*cos(340°), 256+110*sin(340°) = 359.3, 218.4
    Large arc flag = 1 (>180°), sweep = 1 (clockwise)
  -->
  <path d="M 327 340
           A 110 110 0 1 1 359 218"
    fill="none"
    stroke="#d41515"
    stroke-width="18"
    stroke-linecap="round"/>

  <!-- Checkmark: tip reaches toward the circle gap at top-right -->
  <polyline
    points="213,262 248,300 340,198"
    fill="none"
    stroke="#d41515"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
